<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TANIA77 - halaman resmi dan informasi terbaru.">
  <meta name="robots" content="index, follow">
  <title>TANIA77 - Halaman Resmi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <header class="hero">
      <div class="brand">
        <span class="brand-mark">T</span>
        <span>TANIA77</span>
      </div>

      <div class="status">
        <span class="dot"></span>
        TANIA77
      </div>

      <h1>SELAMAT DATANG DI TANIA77</h1>
      <p class="subtitle">Temukan informasi dan tautan penting di sini.</p>
    </header>

    <main>
      <section class="stats" aria-label="Informasi">
        <div class="stat-card">
          <strong>24/7</strong>
          <span>ONLINE</span>
        </div>
        <div class="stat-card">
          <strong>100%</strong>
          <span>INFORMASI</span>
        </div>
        <div class="stat-card">
          <strong>FAST</strong>
          <span>ACCESS</span>
        </div>
      </section>

      <section class="banner-wrap">
        <img src="banner-tania77.png" alt="Banner TANIA77" class="banner">
      </section>

      <section class="actions" aria-label="Tautan">
        <a class="action primary" href="#" aria-label="Buka halaman utama">
          <span class="icon">⌂</span>
          <span>HALAMAN UTAMA</span>
        </a>

        <a class="action secondary" href="#" aria-label="Hubungi kami">
          <span class="icon">✉</span>
          <span>HUBUNGI KAMI</span>
        </a>
      </section>
    </main>

    <footer>
      © 2026 TANIA77 · Semua hak dilindungi.
    </footer>
  </div>
</body>
</html>
